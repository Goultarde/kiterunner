name: Go

on:
  push:
    branches:
      - main
      - next
  pull_request:
    branches:
      - next
      - main

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.x'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...
